name: Daily Midnight Telegram Screenshots

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

jobs:
  send-screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run daily Telegram screenshot dispatch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_URL: "https://targetsheet0.netlify.app/"
          API_BASE: "https://governor.pythonanywhere.com"
        run: python scripts/send_telegram_reports.py
